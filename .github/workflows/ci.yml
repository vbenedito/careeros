# CI for CareerOS (ENV-08, ENV-09).
# `checks`: lint, typecheck, unit tests and builds on every PR and push to main.
# `backend`: local Supabase stack in Docker, migrations + seed, pgTAP (ADR-0008). E2E is added in #29.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege (ENV-09): the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (ENV-09); the comment shows the release tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (with coverage thresholds, TEST §3)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  backend:
    name: Database (Supabase in Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same stack as local development (ADR-0008); Studio is not needed in CI.
      - name: Start Supabase
        run: pnpm exec supabase start -x studio,postgres-meta

      - name: Reset database (migrations + seed)
        run: pnpm db:reset

      - name: Database tests (pgTAP)
        run: pnpm db:test

      - name: Dashboard integration tests (auth against local Supabase)
        run: scripts/ci/web-integration.sh

      - name: Dashboard server log (on failure)
        if: failure()
        run: cat web-integration-server.log || true

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop --no-backup
