# CI for CareerOS (ENV-08, ENV-09).
# `checks`: lint, workflow lint (actionlint), dependency audit, typecheck, spec-ID traceability, Markdown links, unit tests, landing responsive layout (TEST-01) and builds, store package check on every PR
# and push to main.
# `backend`: local Supabase stack in Docker, incremental migration path (base commit → PR), migrations + seed, pgTAP (ADR-0008), integration and E2E
# (including the app pages' responsive layout, TEST-01).
# Both jobs upload their responsive-layout screenshots as artifacts (14 days) for review.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege (ENV-09): the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (ENV-09); the comment shows the release tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      # Workflow syntax, expressions and (with the runner's shellcheck) `run:` scripts (grill T7).
      # actionlint is pinned by version and checksum. SC2016 is ignored for the `node -e '…'`
      # snippets that mask the database password: the `${…}` there is JavaScript, not shell.
      - name: Lint workflows (actionlint)
        run: |
          scripts/ci/install-actionlint.sh
          actionlint -ignore 'shellcheck reported issue in this script: SC2016'

      # Known vulnerabilities in the production dependency tree (grill T7). A failure means a new
      # advisory: upgrade the package (or its parent), do not mute the check.
      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      # Test names must cite requirement IDs that exist in specs/ (TEST-02); counts go to the summary.
      - name: Spec-ID traceability (TEST-02)
        run: pnpm check:spec-trace

      # Relative links and anchors in the Markdown docs (#155); no network.
      - name: Markdown links
        run: pnpm check:links

      - name: Unit tests (with coverage thresholds, TEST §3)
        run: pnpm test:coverage

      # Same Chromium cache as the backend job (same key), so either job can fill it.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/extension/package.json') }}

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @careeros/extension exec playwright install --no-shell chromium

      # The landing page rendered from renderLanding() at 360–1440 px; no backend needed.
      - name: Landing responsive layout (TEST-01)
        run: pnpm --filter @careeros/extension test:responsive

      - name: Upload landing screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: responsive-screenshots-landing
          path: responsive-screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        run: pnpm build

      # Builds the production store zip with placeholder public values (no secrets) and checks
      # its manifest and file list (#156, STORE-01..07).
      - name: Store package
        run: pnpm check:store-package

  backend:
    name: Database (Supabase in Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same stack as local development (ADR-0008); Studio is not needed in CI.
      # #82: the stack's fixed host ports (54320–54329) lie in Linux's ephemeral range
      # (32768–60999), so an outbound connection (e.g. an image pull) could hold one and the start
      # failed with "failed to bind host port … address already in use". Ephemeral ports are
      # moved above them first; one retry covers any other transient container start failure.
      - name: Start Supabase
        run: |
          sudo sysctl -w net.ipv4.ip_local_port_range="61000 65535"
          pnpm exec supabase start -x studio,postgres-meta || {
            echo "::warning::supabase start failed; retrying once"
            pnpm exec supabase stop --no-backup || true
            pnpm exec supabase start -x studio,postgres-meta
          }

      # The production path (grill T1): when the change adds migrations, apply only the base
      # commit's migrations and the seed, then the full set with `migration up`, then pgTAP.
      # No-op without new migrations. The clean reset below is the empty-database path.
      - name: Incremental migrations (base commit → full set, then pgTAP)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci/incremental-migrations.sh

      - name: Reset database (migrations + seed)
        run: pnpm db:reset

      - name: Database tests (pgTAP)
        run: pnpm db:test

      # The runner image already has Chromium's system libraries, so no apt step (--with-deps
      # pulled packages from a slow mirror: ~9 min). Only full Chromium is needed (tests use
      # channel "chromium"), and it is cached per Playwright version.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/extension/package.json') }}

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @careeros/extension exec playwright install --no-shell chromium

      # One dashboard server for both suites: dashboard HTTP tests, then real-Chromium
      # extension tests (including the /connect end-to-end flow).
      - name: Integration and E2E tests (dashboard + extension against local Supabase)
        run: scripts/ci/integration.sh

      - name: Upload app page screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: responsive-screenshots-app
          path: responsive-screenshots/
          retention-days: 14
          if-no-files-found: ignore

      # Restore procedure of docs/operations.md, proven on every run (#31). Runs last: it resets
      # the local database.
      - name: Backup → restore round trip
        run: |
          scripts/ops/install-age.sh
          scripts/ops/backup-restore-test.sh

      - name: Dashboard server log (on failure)
        if: failure()
        run: cat web-integration-server.log || true

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop --no-backup
