# Weekly encrypted backup of the production database (#31, docs/operations.md).
# The repository is public, so the dump is encrypted with `age` BEFORE it is stored: only the
# holder of the private key (kept offline by the product owner) can read it.
# Needs, in the GitHub environment `production-backup` (deployment branches: `main` only): secret
# SUPABASE_DB_URL (Session pooler URI, IPv4, ending in `?sslmode=require`) and variable
# BACKUP_AGE_RECIPIENT (an age public key). Without them the job FAILS (grill H7): a silently
# skipped backup is worse than a red run, which GitHub emails. health.yml also checks that the
# newest backup artifact is under 8 days old.
# Security (#112): the guarantee is the environment's deployment-branch rule (`main` only) with
# the secret existing nowhere else (no repository-level copy); a branch can edit this file, so
# the `if:` below is only a second layer. Only the dump step receives the database URL.
# GitHub disables schedules in public repos after 60 days without repository activity, silently:
# docs/operations.md §5 has the monthly check.

name: Backup

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (03:17 in São Paulo)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted database dump
    # Second layer: never from another branch (the environment's branch rule is the real guard).
    # Forks have no configuration and no schedule to care about, so they skip instead of failing.
    if: github.repository == 'vbenedito/careeros' && github.ref == 'refs/heads/main'
    environment: production-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check configuration
        env:
          # Only whether it is set, never the URL itself.
          HAS_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          if [ "$HAS_DB_URL" != "true" ]; then
            echo "::error::SUPABASE_DB_URL is not set in the production-backup environment: no backup was made."
            exit 1
          fi
          if [ -z "$AGE_RECIPIENT" ]; then
            echo "::error::BACKUP_AGE_RECIPIENT is not set in the production-backup environment: no backup was made."
            exit 1
          fi

      - name: Checkout (for the dump scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install age (pinned, checksum verified)
        run: scripts/ops/install-age.sh

      - name: Dump and encrypt (plaintext never touches the disk)
        # The only step that receives the database URL.
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        # Shared with migrate.yml (#147): db-dump.sh | gzip -9 | age, data only.
        run: |
          set -euo pipefail
          name="careeros-$(date -u +%Y-%m-%d)-run${GITHUB_RUN_ID}.sql.gz.age"
          scripts/ops/backup-encrypted.sh "$name"
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"

      - name: Store the encrypted dump (90 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
